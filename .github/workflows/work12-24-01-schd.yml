name: WORK12-24-01 SCHD real source collection

on:
  push:
    branches: [work12-24-01-schd-actions-20261008]
    paths:
      - 'work12_24_01/**'
      - '.github/workflows/work12-24-01-schd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required Python dependencies
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.60,<2' 'pandas>=2.2,<3' 'pandas_market_calendars>=4.4,<6' 'requests>=2.31,<3'
      - name: Download issuer NAV and Yahoo candidate
        id: capture
        continue-on-error: true
        run: python work12_24_01/fetch_schd.py
      - name: Capture output artifact and audit regardless of network result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WORK12-24-01-SCHD-raw-nav-and-market-candidate
          path: work12_24_01/output/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce official raw NAV presence
        if: steps.capture.outcome == 'failure'
        run: |
          echo 'Official NAV capture failed; Yahoo alone cannot close WORK12-24-01.'
          exit 1
