name: WORK12-24-01 SCHD real source collection

on:
  push:
    branches: [work12-24-01-schd-actions-20261008]
    paths:
      - 'work12_24_01/**'
      - '.github/workflows/work12-24-01-schd.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'work12_24_01/**'
      - '.github/workflows/work12-24-01-schd.yml'

permissions:
  contents: write

jobs:
  schd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work12-24-01-schd-actions-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required Python dependencies
        run: python -m pip install --disable-pip-version-check 'yfinance>=0.2.60,<2' 'pandas>=2.2,<3' 'pandas_market_calendars>=4.4,<6' 'requests>=2.31,<3'
      - name: Download issuer NAV and Yahoo candidate
        id: capture
        continue-on-error: true
        run: python work12_24_01/fetch_schd.py
      - name: Capture output artifact and audit regardless of network result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WORK12-24-01-SCHD-raw-nav-and-market-candidate
          path: work12_24_01/output/
          if-no-files-found: error
          retention-days: 30
      - name: Persist real fetched data in this isolated public branch
        if: always()
        run: |
          if [ ! -f work12_24_01/output/SOURCE_AUDIT.json ]; then
            echo 'No audit file; nothing to persist'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work12_24_01/output/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive fetched SCHD third-party dataset and provenance audit'
            git push origin HEAD:work12-24-01-schd-actions-20261008
          fi
      - name: Enforce official raw NAV presence
        if: steps.capture.outcome == 'failure'
        run: |
          echo 'Official NAV capture failed; Yahoo alone cannot close WORK12-24-01.'
          exit 1
