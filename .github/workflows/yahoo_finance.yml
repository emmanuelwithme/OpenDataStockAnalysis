name: Yahoo Finance Research Pipeline
on:
  pull_request:
    paths:
      - 'yahoo_pipeline/**'
      - '.github/workflows/yahoo_finance.yml'
  push:
    branches:
      - feature/yahoo-finance-research-20261010
    paths:
      - 'yahoo_pipeline/**'
      - '.github/workflows/yahoo_finance.yml'
  workflow_dispatch:
  schedule:
    # Taiwan 07:20 Tue-Sat: US Mon-Fri close
    - cron: '20 23 * * 1-5'
    # Taiwan 16:20 Mon-Fri: TW market close
    - cron: '20 8 * * 1-5'
permissions:
  contents: read
concurrency:
  group: yahoo-finance-research
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install -r yahoo_pipeline/requirements-dev.txt
      - name: Offline tests
        run: PYTHONPATH=yahoo_pipeline pytest -q yahoo_pipeline/tests

  live_smoke:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Yahoo client
        run: pip install -r yahoo_pipeline/requirements.txt
      - name: Download ACTUAL Yahoo Finance VOO history
        run: PYTHONPATH=yahoo_pipeline python -m yf_pipeline.cli --project-dir yahoo_pipeline --symbols VOO

  collect:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install -r yahoo_pipeline/requirements.txt
      - name: Download ALL Yahoo histories
        run: PYTHONPATH=yahoo_pipeline python -m yf_pipeline.cli --project-dir yahoo_pipeline
      - name: Upload research results as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-research-data
          path: |
            yahoo_pipeline/outputs/
            yahoo_pipeline/data/history/
          retention-days: 7
          if-no-files-found: warn

  work12_controlled_pilot:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and import smoke (no downstream Frozen calculations)
        run: python -m py_compile yahoo_pipeline/work12_yahoo_live_pilot.py
      - name: Actual Yahoo chart raw AAPL price dividend split controlled pilot
        run: python yahoo_pipeline/work12_yahoo_live_pilot.py --symbol AAPL --start 2020-01-01 --end 2021-01-01
      - name: Actual Yahoo chart raw VOO price and adjusted close controlled pilot
        run: python yahoo_pipeline/work12_yahoo_live_pilot.py --symbol VOO --start 2025-01-01 --end 2025-12-31
